services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    # Public domain is assigned in Coolify (docker_compose_domains → frontend:3000).
    # Local run: add `ports: ["3000:3000"]`.
    expose:
      - "3000"
    depends_on:
      - backend
